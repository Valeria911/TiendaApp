<div class="container mt-4">
  <h2 class="mb-3 text-center">Gestión de Productos</h2>

  <div *ngIf="loading" class="alert alert-info text-center">
    Cargando productos...
  </div>

  <div *ngIf="error" class="alert alert-danger text-center">
    {{ error }}
  </div>

  <div class="d-flex justify-content-end mb-3">
    <a 
      *ngIf="auth.esAdmin()"
      routerLink="/productos/nuevo" 
      class="btn btn-success">
      Nuevo Producto
    </a>
  </div>

  <!-- Tabla de productos -->
  <table *ngIf="!loading && !error && productos.length > 0" class="table table-striped table-bordered table-hover shadow-sm">
    <thead class="table-info">
      <tr>
        <th scope="col"># ID</th>
        <th scope="col">Nombre</th>
        <th scope="col">Descripción</th>
        <th scope="col">Precio</th>
        <th scope="col">Stock</th>
        <th scope="col" class="text-center">Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let producto of productos">
        <td class="align-middle">{{ producto.id }}</td>
        <td class="align-middle">
          <a [routerLink]="['/productos', producto.id]" class="text-decoration-none fw-semibold">
            {{ producto.nombre }}
          </a>
        </td>
        <td class="align-middle">{{ producto.descripcion }}</td>
        <td class="align-middle">{{ producto.precio }}</td>
        <td class="align-middle">{{ producto.stock }}</td>

        <td class="align-middle text-center">

          <a 
            *ngIf="auth.esAdmin()"
            [routerLink]="['/productos/editar', producto.id]" 
            class="btn btn-sm btn-outline-warning me-1">
            Editar
          </a>

          <button 
            *ngIf="auth.esAdmin()"
            (click)="eliminar(producto.id)" 
            class="btn btn-sm btn-outline-danger">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !error && productos.length === 0" class="alert alert-secondary text-center">
    No hay productos registrados en la base de datos.
  </div>
</div>
