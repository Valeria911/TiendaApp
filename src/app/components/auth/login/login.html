<div class="container mt-4" style="max-width: 480px;">
  <h2 class="mb-3">Iniciar sesión</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input
        type="email"
        class="form-control"
        formControlName="correo"
        placeholder="correo@tienda.cl"
      />
      <div class="text-danger small" *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid">
        Ingrese un correo electrónico válido
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input
        type="password"
        class="form-control"
        formControlName="contrasena"
        placeholder="••••••"
      />
      <div class="text-danger small" *ngIf="form.get('contrasena')?.touched && form.get('contrasena')?.invalid">
        La contraseña es obligatoria
      </div>
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger py-2">
      {{ mensajeError }}
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <a routerLink="/recuperar" class="btn btn-link btn-sm">
      ¿Olvidaste tu contraseña?
    </a>
  </form>
</div>
