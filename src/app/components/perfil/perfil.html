<div class="container py-4">

  <div class="mb-4">
    <h2 class="mb-1">Mi Perfil</h2>
    <p class="text-muted mb-0">
      Información del usuario logueado
    </p>
  </div>

  <div class="alert alert-warning" *ngIf="!usuarioActual()">
    No existe sesión iniciada
  </div>

  <div class="card shadow-sm perfil-card" *ngIf="usuarioActual() as usuario">
    <div class="card-body p-4">

      <div class="row g-4">

        <div class="col-12 col-md-4 text-center border-end-md">
          <div class="avatar-perfil mx-auto mb-3">
            {{ usuario.nombre.charAt(0) }}
          </div>

          <h4 class="mb-1">{{ usuario.nombre }}</h4>
          <p class="text-muted mb-2">{{ usuario.correo }}</p>

          <span
            class="badge fs-6"
            [ngClass]="usuario.rol === 'ADMIN' ? 'bg-danger' : 'bg-primary'"
          >
            {{ usuario.rol }}
          </span>
        </div>

        <div class="col-12 col-md-8">
          <div class="row g-3">

            <div class="col-12 col-sm-6">
              <div class="info-box">
                <label class="info-label">ID</label>
                <div class="info-value">{{ usuario.id }}</div>
              </div>
            </div>

            <div class="col-12 col-sm-6">
              <div class="info-box">
                <label class="info-label">Estado</label>
                <div class="info-value">
                  <span
                    class="badge"
                    [ngClass]="usuario.activo ? 'bg-success' : 'bg-secondary'"
                  >
                    {{ usuario.activo ? 'Activo' : 'Inactivo' }}
                  </span>
                </div>
              </div>
            </div>

            <div class="col-12 col-sm-6">
              <div class="info-box">
                <label class="info-label">Fecha de registro</label>
                <div class="info-value">{{ usuario.fechaRegistro }}</div>
              </div>
            </div>

            <div class="col-12 col-sm-6">
              <div class="info-box">
                <label class="info-label">Rol de usuario</label>
                <div class="info-value">{{ usuario.rol }}</div>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
